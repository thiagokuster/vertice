name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-secret-com-mais-de-32-caracteres-ok
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx prisma migrate deploy
      - run: node ./node_modules/tsx/dist/cli.mjs prisma/seed.ts
      - run: node ./node_modules/tsx/dist/cli.mjs scripts/verify.ts
      - run: npm run build
      - name: Testar acessos no servidor
        run: |
          npm run start &
          for _ in $(seq 1 40); do
            curl -sf http://localhost:3000/login && break
            sleep 1
          done
          node ./node_modules/tsx/dist/cli.mjs scripts/access.ts
